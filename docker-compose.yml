services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: clash_royale_db
      POSTGRES_USER: cruser
      POSTGRES_PASSWORD: crpassword
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql

  redis:
    image: redis:8.4-alpine
    ports:
      - "6380:6379"

volumes:
  postgres_data:
